<text x="140" y="44" font-size="11.5" fill="#6b7280">Class I, point 11 · 1 step back · ETSI plan: published Feb 2027, cited May 2027</text>
<text x="140" y="60" font-size="11.5" fill="#b45309">Our estimate: published May 2027 (Nov 2027 if EC/HAS find gaps again), cited Mar 2028 (Aug 2028)</text>
