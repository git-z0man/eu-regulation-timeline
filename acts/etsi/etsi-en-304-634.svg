<text x="140" y="44" font-size="11.5" fill="#6b7280">Class I, point 19 · 2 steps back · ETSI plan: published Mar 2027, cited Jun 2027</text>
<text x="140" y="60" font-size="11.5" fill="#b45309">Our estimate: published May 2027 (Oct 2027 if EC/HAS find gaps again), cited Feb 2028 (Aug 2028)</text>
