<text x="10" y="476" font-size="10.5" fill="#b45309">Our estimate: the steps still open at the durations seen on these standards (resolving the EC/HAS comments 85 d, then 15 d to the EC check, which takes</text>
<text x="10" y="491" font-size="10.5" fill="#b45309">59 d), ETSI&#x27;s planned 64 d to publication and the typical 299 d to the OJ; lighter: one more round of EC/HAS comments.</text>
<text x="10" y="506" font-size="10.5" fill="#5b646b">Source: ETSI work programme (eWPM schedules of the work items, read daily; data as of 26 Nov 2026). Typical path: 29 ETSI harmonised standards on the</text>
<text x="10" y="521" font-size="10.5" fill="#5b646b">same path, published since 2019 (reference set of 24 Nov 2026).</text><text x="10" y="536" font-size="10.5" fill="#5b646b">Steffen Zimmermann, git-z0man.github.io/eu-regulation-timeline, CC BY 4.0 · as of 26 Nov 2026</text>
