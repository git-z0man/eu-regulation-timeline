<text x="140" y="44" font-size="11.5" fill="#6b7280">Class II, point 1 · 1 step back · ETSI plan: published Jan 2027, cited May 2027</text>
<text x="140" y="60" font-size="11.5" fill="#b45309">Our estimate: published Mar 2027 (Aug 2027 if EC/HAS find gaps again), cited Jan 2028 (Jun 2028)</text>
