<rect x="530" y="759" width="330" height="36" fill="#cfe2e4" stroke="#0b4f57" stroke-width="1.2"/><text x="538" y="775" font-size="12.5" fill="#14181c">EN 50770-1-2</text><text x="538" y="789" font-size="10.5" fill="#454c53">citation foreseen</text><rect x="868" y="759" width="150" height="36" fill="#cfe2e4" stroke="#0b4f57" stroke-width="1.2"/><text x="876" y="775" font-size="12.5" fill="#14181c">EN 40000-1-3</text><text x="876" y="789" font-size="10.5" fill="#454c53">citation foreseen</text><rect x="1026" y="759" width="150" height="36" fill="#0b4f57"/><text x="1034" y="781" font-size="13" font-weight="600" fill="#ffffff">yes, with notified body</text><rect x="24" y="809" width="22" height="14" fill="#e4e6e8" stroke="#8a9096" stroke-width="1.2"/><text x="54" y="820" font-size="12" fill="#14181c">Citation in the Official Journal not foreseen: no presumption of conformity</text><rect x="24" y="829" width="22" height="14" fill="#ffffff" stroke="#8a9096" stroke-width="1.2" stroke-dasharray="4 3"/><text x="54" y="840" font-size="12" fill="#14181c">Work not yet started</text><rect x="24" y="849" width="22" height="14" fill="#eef4f4" stroke="#3d7f86" stroke-width="1.2" stroke-dasharray="4 3"/><text x="54" y="860" font-size="12" fill="#14181c">Citation in the Official Journal intended, but questioned and not confirmed</text><rect x="24" y="869" width="22" height="14" fill="#cfe2e4" stroke="#0b4f57" stroke-width="1.2"/><text x="54" y="880" font-size="12" fill="#14181c">Citation in the Official Journal foreseen: presumption of conformity</text><text x="24" y="904" font-size="12" fill="#14181c" font-weight="600">Presumption of conformity:</text><rect x="190" y="893" width="22" height="14" fill="#0b4f57"/><text x="220" y="904" font-size="12" fill="#14181c">yes</text><rect x="257" y="893" width="22" height="14" fill="#cfe2e4"/><text x="287" y="904" font-size="12" fill="#14181c">to be confirmed</text><rect x="408" y="893" width="22" height="14" fill="#e4e6e8"/><text x="438" y="904" font-size="12" fill="#14181c">no</text><text x="24" y="930" font-size="11.5" fill="#454c53">IEC 62443: the European versions EN IEC 62443-3-3, -4-1 and -4-2 with their CENELEC amendments under M/606, not the IEC editions.</text><text x="24" y="947" font-size="11.5" fill="#454c53">PoC TBC: presumption of conformity to be confirmed. * (machinery, CRA verticals): intended use of the product and scope of the standard do not match.</text><text x="24" y="964" font-size="11.5" fill="#454c53">Class II: presumption where the notified body assesses against the harmonised standards.</text><text x="24" y="981" font-size="11.5" fill="#454c53">ETSI standards are not included.</text><text x="24" y="1018" font-size="11" fill="#5b646b">Sources: CRA, M/606 and the CEN-CENELEC work programme; our own assessment.<tspan> · Steffen Zimmermann, git-z0man.github.io/eu-regulation-timeline, CC BY 4.0</tspan></text></svg>
