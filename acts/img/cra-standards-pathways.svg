="156" stroke="#d5d8dc" stroke-width="1"/><text x="24" y="137" font-size="13.5" fill="#14181c">Smartphone</text><text x="282" y="137" font-size="13" fill="#14181c">default</text><text x="372" y="137" font-size="13" fill="#14181c">yes</text><rect x="530" y="115" width="330" height="36" fill="#e4e6e8" stroke="#8a9096" stroke-width="1.2"/><text x="538" y="131" font-size="12.5" fill="#14181c">EN 40000-1-2, EN 40000-1-4</text><text x="538" y="145" font-size="10.5" fill="#454c53">citation not foreseen</text><rect x="868" y="115" width="150" height="36" fill="#cfe2e4" stroke="#0b4f57" stroke-width="1.2"/><text x="876" y="131" font-size="12.5" fill="#14181c">EN 40000-1-3</text><text x="876" y="145" font-size="10.5" fill="#454c53">citation foreseen</text><rect x="1026" y="115" width="150" height="36" fill="#e4e6e8"/><text x="1034" y="137" font-size="13" font-weight="600" fill="#454c53">no</text><line x1="24" y1="202" x2="1176" y2="202" stroke="#d5d8dc" stroke-width="1"/><text x="24" y="183" font-size="13.5" fill="#14181c">Machinery (CRA horizontals)</text><text x="282" y="183" font-size="13" fill="#14181c">default</text><text x="372" y="183" font-size="13" fill="#14181c">yes</text><rect x="530" y="161" width="330" height="36" fill="#e4e6e8" stroke="#8a9096" stroke-width="1.2"/><text x="538" y="177" font-size="12.5" fill="#14181c">EN 40000-1-2, EN 40000-1-4</text><text x="538" y="191" font-size="10.5" fill="#454c53">citation not foreseen</text><rect x="868" y="161" width="150" height="36" fill="#cfe2e4" stroke="#0b4f57" stroke-width="1.2"/><text x="876" y="177" font-size="12.5" fill="#14181c">EN 40000-1-3</text><text x="876" y="191" font-size="10.5" fill="#454c53">citation foreseen</text><rect x="1026" y="161" width="150" height="36" fill="#e4e6e8"/><text x="1034" y="183" font-size="13" font-weight="600" fill="#454c53">no</text><line x1="24" y1="248" x2="1176" y2="248" stroke="#d5d8dc" stroke-width="1"/><text x="24" y="229" font-size="13.5" fill="#14181c">Machinery (MR/CRA st