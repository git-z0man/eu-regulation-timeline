<text x="24" y="36" font-size="21" font-weight="700" fill="#14181c">What the ECCC may commit each year</text>
<text x="24" y="60" font-size="14" fill="#454c53">Commitment appropriations in EUR million: 2021–2025 as budgeted, 2026 as planned, 2027–2029 in the draft plan.</text>
<text x="24" y="78" font-size="14" fill="#454c53">Digital Europe and Horizon Europe end in 2027; the next budget framework is not adopted.</text>
