<text x="24" y="36" font-size="21" font-weight="700" fill="#14181c">ENISA&#x27;s means with the Cybersecurity Act 2</text>
<text x="24" y="60" font-size="14" fill="#454c53">EUR million: 2025 from the accounts, 2026–2028 as planned, from 2028 what the Commission proposal would add (not law).</text>
<text x="24" y="78" font-size="14" fill="#454c53">After 2028 the Union contribution is held at its 2028 level: no plan is published; the proposal adds to the 2025 baseline.</text>
