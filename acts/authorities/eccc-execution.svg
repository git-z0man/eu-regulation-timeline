<text x="24" y="36" font-size="21" font-weight="700" fill="#14181c">How fast the ECCC&#x27;s money is paid out</text>
<text x="24" y="60" font-size="14" fill="#454c53">2025, EUR million: committed to projects, paid, and promised but not yet paid at year-end.</text>
<text x="24" y="78" font-size="14" fill="#454c53">In all, 69% of the payment appropriations were used; EUR 495.7 million are still to be paid.</text>
