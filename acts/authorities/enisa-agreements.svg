<text x="24" y="36" font-size="21" font-weight="700" fill="#14181c">Money from the Commission for agreed actions</text>
<text x="24" y="60" font-size="14" fill="#454c53">Actions the Commission finances through ENISA, by period: EUR 101.4 million agreed since 2022.</text>
<text x="24" y="78" font-size="14" fill="#454c53">Most end in 2028; their staff are contract agents hired for them.</text>
