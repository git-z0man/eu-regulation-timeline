/* the bar sits in its own wrapper, a direct child of <body>, at the same place on every page: the 1320px column of
   the start page and the act pages, 24px gutter, 16px at 700px and below (owner's report of 15 Oct 2026) */

@media (max-width: 700px) { .navwrap { padding-inline: 16px; } }

/* light, dark or as the system: three quiet icon buttons, the chosen one petrol and underlined like the current
