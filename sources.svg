<text font-size="18" fill="#222222" text-anchor="start" font-weight="bold"><tspan x="24.0" y="28.3">Where the information comes from</tspan></text>
<text font-size="11" fill="#555555" text-anchor="start"><tspan x="24.0" y="48.9">Sources (left) are read by the tools (middle), which write the files of the repository (right); the analysis and the public site are built from them. The routine runs the tools on weekdays at 05:15 UTC and opens a pull request; it is merged once the checks pass.</tspan></text>
