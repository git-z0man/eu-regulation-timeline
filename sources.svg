<text font-size="20" fill="#222222" text-anchor="start" font-family='"Source Serif 4", Georgia, serif' font-weight="600"><tspan x="24.0" y="29.0">Where the information comes from</tspan></text>
<text font-size="11" fill="#454c53" text-anchor="start"><tspan x="24.0" y="49.0">Sources (left) are read by the tools (middle), which write the files of the repository (right); the analysis and the public site are built from them. A routine runs the tools on weekdays at</tspan><tspan x="24.0" y="62.8">05:15 UTC and merges its pull request once the checks pass; a second one builds and publishes this site every day at 06:47 UTC.</tspan></text>
