<rect width="900" height="331" fill="#fff"/>
<text x="24" y="36" font-size="19.6" font-weight="700" fill="#14181c">Jede zweite private Stelle sieht ihren Bedarf nur teilweise oder weniger getroffen</text>
<text x="24" y="60" font-size="14" fill="#454c53">Umfrage zur Evaluierung der ENISA durch die Kommission: wie weit ihre Unterstützung den Bedarf jeder Gruppe trifft</text>
