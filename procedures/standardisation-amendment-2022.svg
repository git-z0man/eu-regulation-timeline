<text font-size="11" fill="#555555" text-anchor="start"><tspan x="24.0" y="48.9">Procedure 2022/0021(COD). Upper part: the ordinary legislative procedure (Art. 294 TFEU); the route could not be derived from the register. Lower part: the act&#x27;s procedure over time. Every event cites its source (see standardisation-amendment-2022.html).</tspan></text>
