<text x="40.0" y="258.0" font-size="13" fill="#555555" text-anchor="start">Auch kurze Phasen können den Median verschieben: Im April 2019 und 2024 stimmte das Parlament viele Dossiers vor der rechtssprachlichen Überarbeitung ab, der Rat nahm sie 3–8 Monate später an.</text>
