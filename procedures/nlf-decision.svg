<text font-size="11" fill="#555555" text-anchor="start"><tspan x="24.0" y="48.9">Procedure 2007/0030(COD). Upper part: the ordinary legislative procedure (Art. 294 TFEU); the route this act took is highlighted. Lower part: the act&#x27;s procedure over time. Every event cites its source (see nlf-decision.html).</tspan></text>
